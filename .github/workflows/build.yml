# Build upstream Cloudflare workerd for linux-arm64 WITHOUT tcmalloc, so it runs on arm64 kernels
# with a 39-bit user virtual address space (CONFIG_ARM64_VA_BITS_39), such as ChromeOS's Linux
# environment. See README.md for what was tested.
#
# Why: the npm @cloudflare/workerd-linux-arm64 binaries statically link tcmalloc, which needs a
# 48-bit VA -> "MmapAligned() failed ... TCMalloc assumes a 48-bit virtual address space"
# (cloudflare/workerd#5020). Upstream already has a switch for this (used by its ASAN/TSAN configs):
#   --@workerd//src/workerd/server:use_tcmalloc=False   -> falls back to the system (glibc) malloc
#
# Run: Actions -> "Build workerd arm64 (no tcmalloc)" -> Run workflow, with workerd_ref set to the
# newest workerd in your package-lock.json (1.20261102.1 -> tag v1.20261102.1). Tick
# "release" to publish the binary and its sha256 as a GitHub Release with that tag; the release is
# made only when the smoke test under an emulated 39-bit address space passed.
# The repo is public because free ubuntu-24.04-arm runners there have 4 vCPU/16 GB; a cold build
# takes about 1-4 h. If it times out, "Re-run jobs": the Bazel disk cache is saved even on failure,
# so the re-run resumes where it stopped.
#
# Adapted from coolcomfort/workerd-android-arm64, with every action and bazelisk pinned.

name: Build workerd arm64 (no tcmalloc)

on:
  workflow_dispatch:
    inputs:
      workerd_ref:
        description: "workerd git tag to build; the newest workerd in your package-lock.json (e.g. v1.20261102.1)"
        required: true
        default: v1.20261102.1
      release:
        description: "Publish the binary as a GitHub Release tagged workerd_ref (only if the smoke test passes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      smoke: ${{ steps.smoke.outcome }}
      upstream_sha: ${{ steps.src.outputs.sha }}
      control: ${{ steps.smoke.outputs.control }}
      sqlite: ${{ steps.smoke.outputs.sqlite }}
    env:
      REF: ${{ inputs.workerd_ref }}
      CACHE_KEY: bazel-arm64-notcmalloc-${{ inputs.workerd_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout cloudflare/workerd@${{ inputs.workerd_ref }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: cloudflare/workerd
          ref: ${{ inputs.workerd_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Record the upstream commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # workerd's own composite action at this exact tag: installs LLVM/clang 19 + lld + libc++ from
      # apt.llvm.org and appends the matching CC/ld-path lines to .bazelrc. An empty cookie makes Bazel
      # use the unauthenticated chromium.googlesource.com endpoint (slower, but works).
      - name: Set up toolchain (workerd's .github/actions/setup-runner)
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Install bazelisk (honours .bazelversion)
        run: |
          # Pinned and checked, not "latest"
          curl -fsSL -o "$RUNNER_TEMP/bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-arm64
          echo "b2bcc040c213b44586b121bda6d983c35df121b917c3a7a66fb16f2fa0df1a4f  $RUNNER_TEMP/bazelisk" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/bazelisk" /usr/local/bin/bazel
          echo "wanted: $(cat .bazelversion)"; bazel --version
          nproc; free -g; df -h /

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/bazel-disk-cache
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            bazel-arm64-notcmalloc-${{ inputs.workerd_ref }}-
            bazel-arm64-notcmalloc-

      # Same flags as upstream's linux-arm64 release job (--config=ci --config=release_linux --strip=always)
      # minus their private remote cache / -Werror / test configs, plus use_tcmalloc=False.
      - name: Bazel build //src/workerd/server:workerd (use_tcmalloc=False)
        timeout-minutes: 320
        run: |
          bazel build \
            --config=ci --config=release_linux --strip=always \
            --jobs=HOST_CPUS \
            --@workerd//src/workerd/server:use_tcmalloc=False \
            //src/workerd/server:workerd

      - name: Save Bazel disk cache (always, so a re-run resumes after a timeout)
        if: always()
        run: |
          # Same trick as upstream: drop >100 MB files (the final binary) to keep the cache small.
          [ -d ~/bazel-disk-cache ] && find ~/bazel-disk-cache -size +100M -type f -delete || true
          du -sh ~/bazel-disk-cache || true
      - if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/bazel-disk-cache
          key: ${{ env.CACHE_KEY }}

      - name: Verify binary (no tcmalloc linked)
        run: |
          cp bazel-bin/src/workerd/server/workerd "$RUNNER_TEMP/workerd"
          chmod +x "$RUNNER_TEMP/workerd"
          ls -la "$RUNNER_TEMP/workerd"
          readelf -d "$RUNNER_TEMP/workerd" | grep NEEDED
          if readelf -S "$RUNNER_TEMP/workerd" | grep -q google_malloc; then echo "::error::tcmalloc still linked"; exit 1; fi
          if strings "$RUNNER_TEMP/workerd" | grep -q MmapAligned; then echo "::error::tcmalloc code present"; exit 1; fi
          "$RUNNER_TEMP/workerd" --version

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workerd-linux-arm64-notcmalloc-${{ inputs.workerd_ref }}
          path: ${{ runner.temp }}/workerd
          if-no-files-found: error
          retention-days: 30

      # Emulate a 39-bit VA kernel: an LD_PRELOAD shim reserves every free gap between 2^39 and 2^48 so all
      # later mmaps land below 2^39, like a CONFIG_ARM64_VA_BITS_39 kernel. Positive control: the stock
      # npm binary must die with the same MmapAligned() error seen on such a device.
      - name: Smoke test under emulated 39-bit address space
        id: smoke
        continue-on-error: true
        run: |
          set -u
          T="$RUNNER_TEMP/t"; mkdir -p "$T/do-data"; cd "$T"
          cat > va39.c <<'EOF'
          #define _GNU_SOURCE
          #include <fcntl.h>
          #include <stdint.h>
          #include <sys/mman.h>
          #include <unistd.h>
          #ifndef MAP_FIXED_NOREPLACE
          #define MAP_FIXED_NOREPLACE 0x100000
          #endif
          static char buf[1 << 20];
          static uintptr_t starts[4096], ends[4096];
          static uintptr_t hex(const char **p) { uintptr_t v = 0; for (;; (*p)++) { char c = **p;
            if (c >= '0' && c <= '9') v = v * 16 + (c - '0'); else if (c >= 'a' && c <= 'f') v = v * 16 + (c - 'a' + 10); else return v; } }
          static void reserve(uintptr_t a, uintptr_t b) { if (b > a) mmap((void *)a, b - a, PROT_NONE,
            MAP_PRIVATE | MAP_ANONYMOUS | MAP_NORESERVE | MAP_FIXED_NOREPLACE, -1, 0); }
          __attribute__((constructor(101))) static void va39_init(void) {
            const uintptr_t lo = (uintptr_t)1 << 39, hi = (uintptr_t)1 << 48;
            int fd = open("/proc/self/maps", O_RDONLY); if (fd < 0) return;
            ssize_t n = 0, r; while (n < (ssize_t)sizeof(buf) - 1 && (r = read(fd, buf + n, sizeof(buf) - 1 - n)) > 0) n += r;
            close(fd); buf[n] = 0; int cnt = 0;
            for (const char *p = buf; *p && cnt < 4096;) { uintptr_t s = hex(&p); p++; uintptr_t e = hex(&p);
              starts[cnt] = s; ends[cnt] = e; cnt++; while (*p && *p != '\n') p++; if (*p) p++; }
            uintptr_t cur = lo;
            for (int i = 0; i < cnt; i++) { if (ends[i] <= cur) continue; if (starts[i] >= hi) break;
              reserve(cur, starts[i] < hi ? starts[i] : hi); cur = ends[i]; }
            reserve(cur, hi);
          }
          EOF
          gcc -O2 -shared -fPIC -o va39.so va39.c
          export VA39="$T/va39.so"

          echo "== positive control: stock npm build ${REF#v} under the shim (expected to crash)"
          mkdir -p stock
          curl -fsSL "$(npm view "@cloudflare/workerd-linux-arm64@${REF#v}" dist.tarball)" \
            | tar xz -C stock --strip-components=2 package/bin/workerd
          LD_PRELOAD="$VA39" ./stock/workerd --version > stock.log 2>&1 && echo "stock exit 0" || echo "stock exit $?"
          head -c 600 stock.log; echo
          if grep -q MmapAligned stock.log; then echo "OK: emulation reproduces the 39-bit VA crash"
            echo "control=reproduced" >> "$GITHUB_OUTPUT"
          else echo "::warning::emulation did not reproduce the tcmalloc crash; results below are not conclusive"; fi

          echo "== new build under the shim"
          LD_PRELOAD="$VA39" "$RUNNER_TEMP/workerd" --version

          cat > hello.js <<'EOF'
          export default { async fetch() { return new Response("hello from workerd\n"); } };
          EOF
          cat > sqlite.js <<'EOF'
          import { DurableObject } from "cloudflare:workers";
          export class Counter extends DurableObject {
            constructor(ctx, env) { super(ctx, env);
              ctx.storage.sql.exec("CREATE TABLE IF NOT EXISTS c (id INTEGER PRIMARY KEY, n INTEGER)"); }
            async fetch() {
              this.ctx.storage.sql.exec("INSERT INTO c (id, n) VALUES (1, 1) ON CONFLICT(id) DO UPDATE SET n = n + 1");
              return new Response("sqlite count=" + this.ctx.storage.sql.exec("SELECT n FROM c WHERE id = 1").one().n + "\n");
            }
          }
          export default { async fetch(req, env) { return env.COUNTER.get(env.COUNTER.idFromName("x")).fetch(req); } };
          EOF
          cat > test.capnp <<EOF
          using Workerd = import "/workerd/workerd.capnp";
          const config :Workerd.Config = (
            services = [ (name = "hello", worker = .hello), (name = "sql", worker = .sql),
                         (name = "disk", disk = (path = "$T/do-data", writable = true)) ],
            sockets = [ (name = "h", address = "127.0.0.1:18787", http = (), service = "hello"),
                        (name = "s", address = "127.0.0.1:18788", http = (), service = "sql") ],
          );
          const hello :Workerd.Worker = (
            modules = [ (name = "worker", esModule = embed "hello.js") ], compatibilityDate = "2025-01-01");
          const sql :Workerd.Worker = (
            modules = [ (name = "worker", esModule = embed "sqlite.js") ], compatibilityDate = "2025-01-01",
            durableObjectNamespaces = [ (className = "Counter", uniqueKey = "counter", enableSql = true) ],
            durableObjectStorage = (localDisk = "disk"),
            bindings = [ (name = "COUNTER", durableObjectNamespace = "Counter") ]);
          EOF
          LD_PRELOAD="$VA39" "$RUNNER_TEMP/workerd" serve test.capnp > serve.log 2>&1 & P=$!
          ok=""
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18787/ && ok=1 && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18788/ || echo "::warning::SQLite DO request 1 failed"
          s2="$(curl -sf http://127.0.0.1:18788/)" || echo "::warning::SQLite DO request 2 failed"
          echo "$s2"
          [ "$s2" = "sqlite count=2" ] && echo "sqlite=ok" >> "$GITHUB_OUTPUT"
          echo "workerd mappings created above 2^39 (should only be pre-existing ELF/stack/vdso, no heap):"
          awk '$2 != "---p" && length($1) > 21 {print}' /proc/$P/maps | head -20 || true
          kill $P 2>/dev/null || true; wait $P || true
          cat serve.log
          [ -n "$ok" ] || { echo "::error::new build did not serve under emulated 39-bit VA"; exit 1; }

  # A job of its own, so only this job (no Bazel, no upstream code) can write to the repo.
  release:
    needs: build
    if: inputs.release && needs.build.outputs.smoke == 'success'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      REF: ${{ inputs.workerd_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
      CONTROL: ${{ needs.build.outputs.control }}
      SQLITE: ${{ needs.build.outputs.sqlite }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workerd-linux-arm64-notcmalloc-${{ inputs.workerd_ref }}
          path: out

      - name: Create release
        working-directory: out
        run: |
          [[ "$REF" =~ ^v1\.[0-9]{8}\.[0-9]+$ ]] || { echo "::error::not a workerd release tag: $REF"; exit 1; }
          chmod +x workerd
          sha256sum workerd > workerd.sha256
          cat workerd.sha256
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::upstream commit not recorded"; exit 1; }
          sum="$(cut -d' ' -f1 workerd.sha256)"
          B='`'; F='```'
          # Say only what this run's smoke test actually showed.
          tested="this build started and served HTTP"
          [ "$SQLITE" = ok ] && tested="$tested and a SQLite-backed Durable Object"
          tested="$tested under an emulated 39-bit address space"
          if [ "$CONTROL" = reproduced ]; then
            tested="$tested, where the official npm build of the same version crashed with ${B}MmapAligned() failed${B}."
          else
            tested="$tested. The official npm build did not crash under the emulation in this run, so the test is not conclusive."
          fi
          cat > notes.md <<EOF
          Unofficial build of upstream [cloudflare/workerd $REF](https://github.com/cloudflare/workerd/releases/tag/$REF) (source commit [${B}${UPSTREAM_SHA:0:12}${B}](https://github.com/cloudflare/workerd/commit/$UPSTREAM_SHA)), unpatched, compiled with ${B}use_tcmalloc=False${B} for linux-arm64. For local development on arm64 kernels with a 39-bit address space ([cloudflare/workerd#5020](https://github.com/cloudflare/workerd/issues/5020)); test and deploy on the official workerd.

          **Use** it when $REF is the newest workerd in your project (${B}npm ls workerd --all${B}):

          ${F}sh
          gh release download $REF -R $GH_REPO
          sha256sum -c workerd.sha256
          chmod +x workerd
          export MINIFLARE_WORKERD_PATH=\$PWD/workerd
          ${F}

          **Tested:** $tested

          **Built by** [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) of the workflow at [${B}${GITHUB_SHA:0:12}${B}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA). The run's logs expire after GitHub's retention period.

          sha256: ${B}${sum}${B}
          EOF
          cat notes.md
          gh release create "$REF" workerd workerd.sha256 \
            --target "$GITHUB_SHA" \
            --title "workerd $REF without tcmalloc (linux-arm64)" \
            --notes-file notes.md
